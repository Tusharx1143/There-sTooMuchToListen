<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listen to Anything</title>
    <style>
      /* --- Theme tokens -------------------------------------------------
         The canvas is most of the app, so its colours live in src/ui/theme.ts
         and these mirror them for the DOM chrome. `--scrim` is kept as raw RGB
         components so panels can fade their own background out to nothing. */
      :root, :root[data-theme="dark"] {
        --bg: #0a0a0a;
        --scrim: 10, 10, 10;
        --fg: hsl(0, 0%, 98%);
        --fg-muted: hsl(0, 0%, 68%);
        --fg-faint: hsl(0, 0%, 45%);
        --surface: rgba(18, 18, 22, .92);
        --border: hsl(0, 0%, 20%);
        --hover: rgba(255, 255, 255, .10);
        --accent: #ff7a45;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: hsl(30, 13%, 64%);
        --scrim: 186, 176, 163;
        --fg: hsl(0, 0%, 6%);
        --fg-muted: hsl(30, 8%, 24%);
        --fg-faint: hsl(30, 8%, 36%);
        --surface: hsla(30, 14%, 78%, .92);
        --border: hsl(30, 10%, 42%);
        --hover: rgba(0, 0, 0, .10);
        --accent: #a8380c;
        color-scheme: light;
      }

      /* --- Motion -------------------------------------------------------- */
      :root {
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --dur: 200ms;
        --dur-fast: 150ms;
      }
      @media (prefers-reduced-motion: reduce) {
        :root { --dur: 1ms; --dur-fast: 1ms; }
      }

      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
      canvas { display: block; }
      /* Scoped to the atlas on purpose: a blanket `inset: 0` here also supplies
         top/left to the minimap, which beats its own right/bottom and pins it
         to the top-left corner. */
      #atlas { position: fixed; inset: 0; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }

      button { font: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      [data-unlock] {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: rgba(var(--scrim), .82); backdrop-filter: blur(6px);
        color: var(--fg); font: 16px/1.5 system-ui, sans-serif; text-align: center;
        cursor: pointer;
      }
      [data-unlock] h1 { font-size: 2rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
      [data-unlock] p { margin: .25rem 0; color: var(--fg-muted); }
      .unlock-cta { margin-top: 1.25rem !important; color: var(--fg) !important; font-weight: 600; }

      /* --- Top-left: readout + search ------------------------------------ */
      .axis-hud {
        position: fixed; top: 18px; left: 20px;
        font: 600 13px/1 system-ui, sans-serif; letter-spacing: .04em;
        color: var(--fg); text-transform: uppercase;
        text-shadow: 0 1px 8px rgba(var(--scrim), .9);
      }
      .axis-sep { opacity: .45; margin: 0 .5em; }
      .axis-genre { color: var(--fg-muted); }

      .search { position: fixed; top: 44px; left: 20px; width: 240px; }
      .search input {
        width: 100%; padding: 8px 10px; border-radius: 8px;
        border: 1px solid var(--border); background: var(--surface); color: var(--fg);
        font: 13px system-ui, sans-serif;
      }
      .search-results { list-style: none; margin: 6px 0 0; padding: 0; }
      .search-results li {
        padding: 7px 10px; background: var(--surface); color: var(--fg);
        border: 1px solid var(--border); border-top: 0;
        font: 13px system-ui, sans-serif; cursor: pointer;
      }
      .search-results li:hover { background: var(--hover); }

      /* --- Top-right: the toolbar ---------------------------------------- */
      .toolbar {
        position: fixed; top: 14px; right: 20px;
        display: flex; align-items: center; gap: 2px;
      }
      .tool-btn {
        width: 34px; height: 34px; display: grid; place-items: center;
        border: 0; border-radius: 999px; background: none; color: var(--fg);
        cursor: pointer; opacity: .78;
        transition: background var(--dur-fast) ease, opacity var(--dur-fast) ease;
      }
      .tool-btn:hover { background: var(--hover); opacity: 1; }
      .tool-btn[aria-expanded="true"] { background: var(--hover); opacity: 1; box-shadow: inset 0 0 0 1px var(--border); }
      .tool-btn svg { width: 18px; height: 18px; display: block; }

      /* --- Overlay panels -------------------------------------------------
         Deliberately not a card: the panel fades its own ground out to the
         left so it reads as part of the atlas rather than a box on top of it.
         The scrim is still needed — plain text over album art is unreadable. */
      .panel {
        position: fixed; top: 0; right: 0; bottom: 0;
        /* The left padding is not decoration: it is the runway the scrim needs
           to reach full opacity before any text starts, so nothing is ever set
           over bare album art. Keep the padding inside the opaque stop below. */
        width: min(620px, 100vw); padding: 62px 24px 28px min(140px, 20vw);
        box-sizing: border-box; overflow-y: auto;
        color: var(--fg); font: 14px/1.55 system-ui, sans-serif;
        background: linear-gradient(
          to left,
          rgb(var(--scrim)) 0%,
          rgb(var(--scrim)) 80%,
          rgba(var(--scrim), 0) 100%
        );
        opacity: 0; transform: translateX(14px); pointer-events: none;
        transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
      }
      .panel[data-open] { opacity: 1; transform: none; pointer-events: auto; }

      .panel h2 {
        margin: 0; font: 600 12px/1 system-ui, sans-serif;
        letter-spacing: .09em; text-transform: uppercase;
      }
      .panel p { margin: 0 0 .75em; color: var(--fg-muted); }
      .panel p:last-child { margin-bottom: 0; }
      .panel a { color: var(--accent); }

      .panel-actions {
        display: flex; justify-content: space-between; align-items: center;
        gap: 12px; margin-top: 24px;
      }
      .btn {
        padding: 7px 14px; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--border); background: var(--surface); color: var(--fg);
        font: 13px system-ui, sans-serif;
        transition: background var(--dur-fast) ease;
      }
      .btn:hover { background: var(--hover); }

      /* --- Accordion ----------------------------------------------------- */
      .acc-item { border-bottom: 1px solid var(--border); }
      .acc-trigger {
        width: 100%; display: flex; align-items: center; justify-content: space-between;
        gap: 16px; padding: 15px 0; border: 0; background: none; color: inherit;
        cursor: pointer; text-align: left;
      }
      .acc-chevron {
        width: 16px; height: 16px; flex: none; color: var(--fg-faint);
        transition: transform var(--dur) ease;
      }
      .acc-trigger[aria-expanded="true"] .acc-chevron { transform: rotate(180deg); }
      /* Height is set in px by aboutPanel.ts; `auto` cannot be transitioned. */
      .acc-panel { height: 0; overflow: hidden; transition: height var(--dur) var(--ease); }
      .acc-body { padding-bottom: 18px; }

      /* --- Settings controls ---------------------------------------------- */
      .set-group { margin-bottom: 22px; }
      .set-group > h2 { margin-bottom: 10px; color: var(--fg); }

      .opt-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .opt {
        flex: 1 1 0; min-width: 96px; padding: 10px 12px; border-radius: 10px;
        border: 1px solid var(--border); background: var(--surface); color: var(--fg-muted);
        font: 13px system-ui, sans-serif; cursor: pointer; text-align: left;
        transition: background var(--dur-fast) ease, border-color var(--dur-fast) ease,
                    color var(--dur-fast) ease;
      }
      .opt:hover { background: var(--hover); }
      .opt[aria-pressed="true"] {
        border-color: var(--fg); color: var(--fg); font-weight: 600;
      }

      .set-slider { display: flex; align-items: center; gap: 12px; }
      .set-slider label { flex: none; width: 96px; color: var(--fg-muted); font-size: 13px; }
      .set-slider input[type=range] { flex: 1; accent-color: var(--accent); }
      .set-slider output { flex: none; width: 42px; text-align: right; color: var(--fg-faint); font-size: 12px; font-variant-numeric: tabular-nums; }

      .switch-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
      .switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; }
      .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
      .switch-track {
        width: 34px; height: 19px; border-radius: 999px; flex: none;
        background: var(--surface); border: 1px solid var(--border); position: relative;
        transition: background var(--dur-fast) ease, border-color var(--dur-fast) ease;
      }
      .switch-track::after {
        content: ''; position: absolute; top: 2px; left: 2px;
        width: 13px; height: 13px; border-radius: 50%; background: var(--fg-faint);
        transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) ease;
      }
      .switch input:checked + .switch-track { background: var(--fg); border-color: var(--fg); }
      .switch input:checked + .switch-track::after { transform: translateX(15px); background: var(--bg); }
      .switch input:focus-visible + .switch-track { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* --- Bottom chrome --------------------------------------------------- */
      .now-playing {
        position: fixed; left: 20px; bottom: 20px; width: min(440px, calc(100vw - 40px));
        display: none; gap: 16px; padding: 18px;
        background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
        backdrop-filter: blur(10px); color: var(--fg); font: 15px/1.45 system-ui, sans-serif;
      }
      .now-playing.visible { display: flex; }
      .np-art { width: 96px; height: 96px; border-radius: 8px; object-fit: cover; flex: none; }
      .np-body { min-width: 0; }
      .now-playing h2 { margin: 0 0 3px; font-size: 18px; text-transform: none; letter-spacing: 0; }
      .np-artist { margin: 0; color: var(--fg-muted); }
      .np-album { margin: 3px 0 0; color: var(--fg-faint); font-size: 13px; }
      .np-links { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
      .np-links a { color: var(--accent); font-size: 13px; }
      .np-close {
        position: absolute; top: 8px; right: 12px; background: none; border: 0;
        color: var(--fg-faint); font-size: 22px; cursor: pointer; line-height: 1;
      }
      .minimap {
        position: fixed; right: 20px; bottom: 20px;
        border: 1px solid var(--border); border-radius: 8px; cursor: crosshair;
      }
      .stale-notice {
        position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
        margin: 0; color: var(--fg-faint); font: 11px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="atlas"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
